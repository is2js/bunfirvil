name: Preserve legacy assets and redirect GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Keep Playwright apt dependencies on a stable supported distribution.
    # The ubuntu-latest 26.04 image hit a Microsoft apt-repository 403.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build unchanged legacy app assets
        run: npm run build
      - name: Verify original static output before redirect overlay
        run: npm run verify:dist
      - name: Check compatibility redirects
        run: node --test scripts/legacy-pages-redirect.test.mjs
      - name: Overlay only seven entry HTML redirects
        run: node scripts/legacy-pages-redirect.mjs
      - name: Verify retained assets and redirect output
        run: npm run verify:dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
